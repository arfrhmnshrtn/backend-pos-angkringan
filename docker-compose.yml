services:
  app:
    image: node:22
    container_name: app_angkringan
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '3000:3000'
    command: sh -c "npm install && npx prisma generate && npm run start:dev"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: db_angkringan
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: arief140105
      POSTGRES_DB: db_angkringan
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
